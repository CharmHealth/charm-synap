[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synap"
version = "0.2.0"
description = "Cognitive memory architecture for LLM agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/veeeceee/synap"
Repository = "https://github.com/veeeceee/synap"
Issues = "https://github.com/veeeceee/synap/issues"
Changelog = "https://github.com/veeeceee/synap/blob/main/CHANGELOG.md"

[project.optional-dependencies]
kuzu = ["kuzu>=0.8.0"]
postgres = ["asyncpg>=0.30.0"]
mcp = ["fastmcp>=2.0.0"]
fastapi = ["fastapi>=0.115.0", "pydantic>=2.0", "uvicorn>=0.30.0"]
# tracerite 2.6.0 renamed the module-level `style` that sanic reads as
# `tracerite.html.style` at import time; excluding it avoids the broken combo
# (2.6.1 restored the alias). sanic itself does not cap tracerite.
sanic = ["sanic>=24.6.0", "pydantic>=2.0", "tracerite!=2.6.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "kuzu>=0.8.0",
    "asyncpg>=0.30.0",
    "httpx>=0.27",
    "sanic-testing>=24.6.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
synap = "synap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/synap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Pragmatic baseline: errors, pyflakes, import sorting, pyupgrade, bugbear.
# Noisier opinionated sets (SIM/S/BLE) are deferred to a later tightening.
select = ["E", "F", "I", "UP", "B"]
# E501 (line length) is a formatting concern owned by `ruff format`, not lint.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Atomicity tests assert that *any* failure rolls back; the exception type is
# secondary and varies by backend.
"tests/test_episode_atomicity.py" = ["B017"]
# Postgres tests import asyncpg conditionally after a DSN/skip guard (E402), and
# assert a broad failure on the write path (B017).
"tests/test_postgres.py" = ["B017", "E402"]

[tool.mypy]
python_version = "3.11"
# Third-party deps without stubs (asyncpg, fastmcp, kuzu) — don't fail on them.
ignore_missing_imports = true

[[tool.mypy.overrides]]
# kuzu's QueryResult.get_next() is typed as returning list | dict; single-row
# reads index into the list, which the code relies on. Suppress that narrowing
# noise for this module only rather than casting every row access.
module = "synap.backends.kuzu"
disable_error_code = ["arg-type", "index"]
