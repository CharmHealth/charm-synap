[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synap"
version = "0.1.0"
description = "Cognitive memory architecture for LLM agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/veeeceee/synap"
Repository = "https://github.com/veeeceee/synap"
Issues = "https://github.com/veeeceee/synap/issues"
Changelog = "https://github.com/veeeceee/synap/blob/main/CHANGELOG.md"

[project.optional-dependencies]
kuzu = ["kuzu>=0.8.0"]
postgres = ["asyncpg>=0.30.0"]
mcp = ["fastmcp>=2.0.0"]
fastapi = ["fastapi>=0.115.0", "pydantic>=2.0", "uvicorn>=0.30.0"]
# tracerite 2.6.0 renamed the module-level `style` that sanic reads as
# `tracerite.html.style` at import time; excluding it avoids the broken combo
# (2.6.1 restored the alias). sanic itself does not cap tracerite.
sanic = ["sanic>=24.6.0", "pydantic>=2.0", "tracerite!=2.6.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "kuzu>=0.8.0",
    "asyncpg>=0.30.0",
    "httpx>=0.27",
    "sanic-testing>=24.6.0",
]

[project.scripts]
synap = "synap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/synap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
